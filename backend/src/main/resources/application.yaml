spring:
  application:
    name: najda-backend
    
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.postgresql.Driver

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
      
  supabase:
    storage:
      bucket: incident-media

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 25MB

najda:
  auth:
    otp:
      code-ttl: 10m
      resend-cooldown: 60s
      max-attempts: 5
      verified-ttl: 15m
  mail:
    api-key: ${BREVO_API_KEY}
    from-email: ${MAIL_FROM_EMAIL}
    from-name: Najda
  incident-location:
    allow-manual-pin: ${INCIDENT_ALLOW_MANUAL_PIN:true}
    manual-pin-max-radius-meters: ${INCIDENT_MANUAL_PIN_MAX_RADIUS_METERS:300}
  push:
    # FCM push delivery (free on the Firebase Spark plan). The in-app inbox works either way.
    enabled: ${PUSH_ENABLED:true}
  web:
    # Where web-push notifications send the user when clicked.
    base-url: ${WEB_BASE_URL:https://najda-web.vercel.app}